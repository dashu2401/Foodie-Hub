<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - FoodieHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="logo">FoodieHub</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="cart.html">Cart (<span id="cartCount">0</span>)</a></li>
      <li><a href="wishlist.html">Wishlist (<span id="wishlistCount">0</span>)</a></li>
    </ul>
  </nav>

  <section class="contact-section">
    <h2>Contact Us</h2>

    <form id="contactForm">
      <input type="text" id="contactName" placeholder="Name" required>
      <input type="email" id="contactEmail" placeholder="Email" required>
      <input type="tel" id="contactPhone" placeholder="Phone" required>
      <input type="text" id="contactSubject" placeholder="Subject" required>
      <textarea id="contactMessage" placeholder="Message" required></textarea>
      <button type="submit">Submit</button>
    </form>

    <div class="contact-info">
      <p>Address: 123 Food Street, India</p>
      <p>Phone: +91 98765 43210</p>
      <p>Email: support@foodiehub.com</p>
      <p>Opening Hours: 10 AM - 11 PM</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
