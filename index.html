<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodie-Hub</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
      body {
        background: #000;
        overflow-x: hidden;
      }

      nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 40px;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(12px);
      }
      .logo {
        font-weight: 800;
        font-size: 22px;
        color: #fde68a;
      }
      nav ul {
        display: flex;
        gap: 18px;
        list-style: none;
      }
      nav ul a {
        color: #fff;
        text-decoration: none;
        font-size: 14px;
      }

      .hero {
        height: 100vh;
        width: 100vw;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      .hero-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.45);
        z-index: 2;
      }
      .hero-content {
        position: relative;
        z-index: 3;
        text-align: center;
      }
      .hero-content h1 {
        font-size: 72px;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
      }
      .hero-content p {
        font-size: 20px;
        color: #fde68a;
        margin: 10px 0 25px;
        letter-spacing: 1px;
      }
      .hero-btns {
        display: flex;
        gap: 16px;
        justify-content: center;
      }
      .btn-gold {
        background: #fde68a;
        color: #422006;
        padding: 14px 32px;
        border-radius: 10px;
        border: none;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-glass {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 14px 32px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(10px);
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">FoodieHub</div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="cart.html">Cart (0)</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>

    <section class="hero">
      <video class="hero-video" autoplay muted loop playsinline>
        <source src="images/hero.mp4" type="video/mp4" />
      </video>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1>Foodie-Hub</h1>
        <p>Hunger Ends Here</p>
        <div class="hero-btns">
          <button class="btn-gold" onclick="window.location.href = 'menu.html'">
            Order Now
          </button>

          <button
            class="btn-glass"
            onclick="window.location.href = 'menu.html'"
          >
            Explore Menu
          </button>
        </div>
      </div>
    </section>
  </body>
</html>
