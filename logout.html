<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logout - FoodieHub</title>
<link rel="stylesheet" href="style.css">
<style>
body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#0a0a0a,#1a1a1a);
}
.logout-box{
background:#151515;
padding:45px 35px;
border-radius:20px;
border:1px solid #222;
width:400px;
text-align:center;
box-shadow:0 15px 50px rgba(255,107,0,0.15);
animation: pop 0.4s ease;
}
@keyframes pop{
from{transform:scale(0.8);opacity:0;}
to{transform:scale(1);opacity:1;}
}
.icon{
width:80px;
height:80px;
background:#1f1f1f;
border:2px solid #ff6b00;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:36px;
margin:0 auto 20px;
}
.logout-box h2{
font-size:24px;
margin-bottom:8px;
}
.logout-box p{
color:#888;
font-size:14px;
line-height:1.5;
margin-bottom:25px;
}
.btns{
display:flex;
flex-direction:column;
gap:12px;
}
.btn-primary{
background:#ff6b00;
border:none;
padding:13px;
color:#fff;
border-radius:30px;
font-weight:bold;
cursor:pointer;
font-size:15px;
transition:0.3s;
}
.btn-primary:hover{
background:#e65f00;
transform:scale(1.02);
}
.btn-secondary{
background:#222;
border:1px solid #333;
padding:12px;
color:#fff;
border-radius:30px;
cursor:pointer;
font-size:14px;
transition:0.3s;
}
.btn-secondary:hover{
background:#333;
}
</style>
</head>
<body>
<div class="logout-box">
<div class="icon">👋</div>
<h2>You've Logged Out</h2>
<p>Thank you for using <span style="color:#ff6b00;font-weight:bold;">FoodieHub</span><br>Your session has been safely ended.</p>
<div class="btns">
<button class="btn-primary" onclick="goLogin()">Login Again →</button>
<button class="btn-secondary" onclick="goHome()">Back to Home</button>
</div>
<p style="margin-top:20px;font-size:11px;color:#555;">Redirecting to login in 3 seconds...</p>
</div>
<script>
localStorage.removeItem("currentUser");
function goLogin(){ window.location.href="login.html"; }
function goHome(){ window.location.href="login.html"; }
setTimeout(()=>{ window.location.href="login.html"; },3000);
</script>
</body>
</html>
